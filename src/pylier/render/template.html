<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pylier — {{NAME}}</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
  :root {
    /* GitHub dark (default) — primer github-vscode-theme tokens */
    --bg: #0d1117;
    --panel-bg: #0d1117;
    --panel-2: #161b22;
    --panel-border: #30363d;
    --text: #e6edf3;
    --muted: #7d8590;
    --accent: #2f81f7;
    --card: #161b22;
    --ink: #e6edf3;
    --node-stroke: #30363d;
    --dot: #21262d;
    --type-bool: #a371f7;
    --type-int: #2f81f7;
    --type-float: #39c5cf;
    --type-str: #f778ba;
    --type-list: #3fb950;
    --type-dict: #d29922;
    --type-tuple: #db61a2;
    --type-binary: #7d8590;
    --type-other: #7d8590;
    --st-busy: #2f81f7;   /* sync executing */
    --st-wait: #d29922;   /* async waiting */
    --st-idle: #3fb950;   /* idle / completed */
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  [data-theme="light"] {
    /* GitHub light */
    --bg: #f6f8fa;
    --panel-bg: #ffffff;
    --panel-2: #ffffff;
    --panel-border: #d0d7de;
    --text: #1f2328;
    --muted: #656d76;
    --accent: #0969da;
    --card: #ffffff;
    --ink: #1f2328;
    --node-stroke: #d0d7de;
    --dot: #d0d7de;
    --type-bool: #8250df;
    --type-int: #0969da;
    --type-float: #0a7c86;
    --type-str: #bf3989;
    --type-list: #1a7f37;
    --type-dict: #9a6700;
    --type-tuple: #bf3989;
    --type-binary: #656d76;
    --type-other: #656d76;
    --st-busy: #0969da;
    --st-wait: #9a6700;
    --st-idle: #1a7f37;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    display: flex; flex-direction: column;
  }
  /* monospace dark header with breadcrumbs + run metadata + theme toggle */
  #header {
    height: 56px; padding: 0 18px; border-bottom: 1px solid var(--panel-border);
    display: flex; align-items: center; gap: 12px; background: var(--panel-2);
  }
  #header h1 { font: 700 16px var(--mono); margin: 0; letter-spacing: -.02em; }
  #header .slash { color: var(--muted); }
  #header .crumb { color: var(--muted); font-size: 13px; }
  #header .crumb b { color: var(--text); font-weight: 600; }
  #header .stamp {
    border: 1px solid var(--panel-border); border-radius: 4px; padding: 3px 7px;
    font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }
  #header .stamp.live { color: var(--st-idle); border-color: var(--st-idle); }
  #header .stamp.done { color: var(--accent); border-color: var(--accent); }
  #header .spacer { flex: 1; }
  #header .dur { font-size: 13px; color: var(--muted); }
  #header .theme-btn {
    background: var(--panel-bg); color: var(--text); border: 1px solid var(--panel-border);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font: 12px var(--mono);
  }
  #header .theme-btn:hover { border-color: var(--accent); }

  #main {
    --left-w: 260px; --sidebar-w: 320px;
    flex: 1; display: grid; grid-template-columns: var(--left-w) minmax(0, 1fr) var(--sidebar-w);
    min-height: 0;
  }
  #main.left-collapsed { grid-template-columns: 34px minmax(0, 1fr) var(--sidebar-w); }
  #main.sidebar-collapsed { grid-template-columns: var(--left-w) minmax(0, 1fr) 34px; }
  #main.left-collapsed.sidebar-collapsed { grid-template-columns: 34px minmax(0, 1fr) 34px; }
  #graph-wrap { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  #graph {
    flex: 1; min-width: 0; min-height: 0; height: auto; background: var(--bg);
    background-image: radial-gradient(var(--dot) .7px, transparent .7px);
    background-size: 18px 18px;
  }
  svg { width: 100%; height: 100%; display: block; }

  #traces, #sidebar { background: var(--panel-bg); overflow: auto; min-width: 0; }
  #traces { border-right: 1px solid var(--panel-border); }
  #filters { border-top: 1px solid var(--panel-border); }
  #main.left-collapsed #traces { overflow: hidden; }
  #main.left-collapsed #traces > :not(.pane-head) { display: none; }
  .trace-tab { width: 100%; background: transparent; border: 1px solid transparent; border-radius: 4px; color: var(--text); cursor: pointer; font: 11px var(--mono); margin: 3px 0; padding: 9px; text-align: left; }
  .trace-tab:hover { background: var(--panel-2); }.trace-tab.active { background: color-mix(in srgb, var(--accent) 16%, var(--panel-2)); border-color: color-mix(in srgb, var(--accent) 55%, var(--panel-border)); }
  .trace-tab .method { color: var(--st-idle); font-size: 9px; margin-right: 5px; }.trace-tab .meta { color: var(--muted); display: block; font-size: 9px; margin-top: 4px; }
  #trace-list { padding: 8px; }
  #endpoint-bar { flex: 0 0 auto; background: var(--panel-bg); border-bottom: 1px solid var(--panel-border); display: flex; gap: 4px; overflow: auto; padding: 7px 12px 0; }
  .endpoint-tab { background: transparent; border: 1px solid transparent; border-bottom: 0; border-radius: 4px 4px 0 0; color: var(--muted); cursor: pointer; font: 11px var(--mono); padding: 7px 10px; white-space: nowrap; }.endpoint-tab.active { background: var(--panel-2); border-color: var(--panel-border); color: var(--accent); }
  #sidebar { border-left: 1px solid var(--panel-border); position: relative; }
  .pane-head {
    height: 40px; padding: 0 10px; border-bottom: 1px solid var(--panel-border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .pane-head h2 { font-size: 10px; margin: 0; color: var(--muted); text-transform: uppercase; letter-spacing: .13em; }
  .pane-toggle {
    border: 0; background: transparent; color: var(--muted); padding: 5px; cursor: pointer;
    font: 14px var(--mono);
  }
  .pane-toggle:hover { color: var(--accent); }
  .section-collapsed .pane-content, .section-collapsed #trace-list { display: none; }
  #sidebar.sidebar-collapsed { overflow: hidden; }
  #sidebar.sidebar-collapsed .pane-content { display: none; }
  #sidebar.sidebar-collapsed .pane-head { height: 100%; padding: 8px; align-items: flex-start; }
  #sidebar.sidebar-collapsed .pane-head h2 { display: none; }
  #filters section, #sidebar section { padding: 16px; border-bottom: 1px solid var(--panel-border); }
  #filters section h2, #sidebar section h2 { font-size: 10px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .13em; }
  .resize-handle { position: absolute; z-index: 2; left: -5px; top: 0; width: 10px; height: 100%; cursor: col-resize; }
  .resize-handle:hover, .resize-handle.dragging { background: color-mix(in srgb, var(--accent) 40%, transparent); }
  #sidebar.sidebar-collapsed .resize-handle { display: none; }
  .summary .row { display: grid; grid-template-columns: 92px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px dotted var(--panel-border); font-size: 13px; }
  .summary .row:last-child { border: 0; }
  .summary .row span:first-child { color: var(--muted); }
  .summary .row b { font-weight: 600; }
  #details .empty { color: var(--muted); font-style: italic; font-size: 13px; }
  #details .drow { margin: 5px 0; font-size: 13px; display: grid; grid-template-columns: 78px 1fr; gap: 6px; }
  #details .drow .k { color: var(--muted); }
  #details .drow .v { word-break: break-word; }
  #details .edges { margin-top: 8px; }
  #details .edge-line { font-size: 12px; margin: 2px 0; }
  #details .edge-line .arr { color: var(--accent); }
  .invocation-list { display: grid; gap: 6px; margin-top: 9px; }
  .invocation-card { border: 1px solid var(--panel-border); border-radius: 6px; background: var(--panel-2); overflow: hidden; }
  .invocation-toggle { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; width: 100%; gap: 7px; align-items: center; padding: 8px; border: 0; background: transparent; color: var(--text); text-align: left; cursor: pointer; font: 11px var(--mono); }
  .invocation-toggle:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .invocation-toggle .chevron { color: var(--muted); }
  .invocation-toggle .call-summary { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .invocation-toggle .call-meta { color: var(--muted); white-space: nowrap; }
  .invocation-body { border-top: 1px solid var(--panel-border); padding: 8px; }
  .invocation-body .payload-title { color: var(--muted); font-size: 10px; letter-spacing: .05em; text-transform: uppercase; margin: 0 0 5px; }
  .invocation-body pre { margin: 0; max-height: 260px; }
  .json-key { color: var(--type-float); }
  .json-string { color: var(--type-str); }
  .json-number { color: var(--type-int); }
  .json-boolean { color: var(--type-bool); }
  .json-null { color: var(--muted); }
  .invocation-hint { color: var(--muted); font-size: 11px; margin: 4px 0 0; }
  .invocation-io { display: grid; gap: 5px; }
  .io-toggle { display: flex; align-items: center; gap: 7px; width: 100%; padding: 6px 0; border: 0; background: transparent; color: var(--text); cursor: pointer; font: 11px var(--mono); text-align: left; }
  .io-toggle:hover { color: var(--accent); }
  .io-toggle .chevron { color: var(--muted); }
  .io-toggle .io-meta { margin-left: auto; color: var(--muted); }
  .io-payload { border-top: 1px solid var(--panel-border); padding-top: 6px; }
  #details pre.value {
    background: var(--bg); border: 1px solid var(--panel-border); border-radius: 6px;
    padding: 6px; font: 11px var(--mono); max-height: 240px; overflow: auto;
    white-space: pre-wrap; word-break: break-all; margin: 4px 0;
  }
  .controls label { display: block; font-size: 13px; margin: 6px 0; cursor: pointer; }
  .edge-mode { display: flex; flex-wrap: wrap; gap: 5px 10px; align-items: center; margin: 8px 0; font-size: 12px; }
  .edge-mode > span { width: 100%; color: var(--muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  .edge-mode label { margin: 0; }
  .controls .btns { display: flex; gap: 8px; margin-top: 8px; }
  .controls button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--panel-border);
    border-radius: 6px; padding: 6px 10px; cursor: pointer; font: 12px var(--mono);
  }
  .controls button:hover { border-color: var(--accent); }
  .tag-options { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-option, .tag-chip {
    border: 1px solid var(--panel-border); border-radius: 999px; padding: 3px 7px;
    color: var(--muted); background: var(--panel-2); font: 11px var(--mono);
  }
  .tag-option { cursor: pointer; }
  .tag-option.selected { color: var(--text); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--panel-2)); }
  .filter-empty { color: var(--muted); font-size: 12px; font-style: italic; }
  .filter-mode { display: flex; gap: 12px; margin-top: 12px; font-size: 12px; }
  .filter-mode label { cursor: pointer; }
  #footer {
    flex: 0 0 34px; min-width: 0; border-top: 1px solid var(--panel-border); background: var(--panel-2);
    color: var(--muted); font-size: 10px; overflow: hidden;
  }
  #footer.console-open { flex-basis: 190px; display: flex; flex-direction: column; }
  .footer-bar { flex: 0 0 34px; min-width: 0; padding: 0 16px; display: flex; justify-content: center; align-items: center; gap: 14px; overflow-x: auto; white-space: nowrap; }
  .footer-legend { display: flex; justify-content: center; align-items: center; gap: 14px; }
  .console-toggle, .console-clear { background: transparent; color: var(--muted); border: 0; padding: 2px 4px; cursor: pointer; font: 10px var(--mono); }
  .console-toggle { margin-left: auto; }
  .console-toggle:hover, .console-clear:hover { color: var(--text); }
  #event-console { flex: 1; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--panel-border); background: var(--bg); }
  .console-head { flex: 0 0 28px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--panel-border); color: var(--muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  .console-clear { margin-left: auto; text-transform: none; letter-spacing: 0; }
  #event-log { flex: 1; min-height: 0; overflow: auto; padding: 7px 12px; font: 11px/1.55 var(--mono); }
  .console-entry { display: flex; gap: 10px; white-space: nowrap; }
  .console-entry time { color: var(--muted); }
  .console-entry .event-kind { color: var(--accent); min-width: 40px; }
  .console-empty { color: var(--muted); font-style: italic; }
  .type-key { display: inline-flex; align-items: center; gap: 5px; color: var(--text); }
  .type-key i { width: 12px; height: 2px; display: inline-block; }
  .type-key .bool { background: var(--type-bool); }.type-key .int { background: var(--type-int); }
  .type-key .float { background: var(--type-float); }.type-key .str { background: var(--type-str); }
  .type-key .list { background: var(--type-list); }.type-key .dict { background: var(--type-dict); }
  .type-key .tuple { background: var(--type-tuple); }.type-key .binary { background: var(--type-binary); }
  .type-key .other { background: var(--type-other); }

  /* node cards: monochrome, dynamic width, status stripe */
  .node { cursor: grab; }
  .node:active { cursor: grabbing; }
  .node rect.body { fill: var(--card); stroke: var(--node-stroke); stroke-width: 1; }
  .node:hover rect.body { stroke: var(--accent); stroke-width: 1.5; }
  .node rect.status { stroke: none; }
  .node.fastapi rect.body { stroke: var(--accent); stroke-width: 1.5; }
  .node.otel rect.body { stroke: var(--type-tuple); stroke-width: 1.5; }
  .node.endpoint rect.body { stroke: var(--st-idle); stroke-width: 1.5; }
  .node text { pointer-events: none; font-family: var(--mono); }
  .node .num { font-size: 9px; fill: var(--muted); }
  .node .name { font-size: 13px; font-weight: 700; fill: var(--ink); }
  .node .module { font-size: 10px; fill: var(--muted); }
  .node .lat { font-size: 10px; fill: var(--ink); text-anchor: end; }
  .node .lat .avg { fill: var(--muted); }

  /* Match the mockup's fine-line, low-noise graph treatment. */
  .link { fill: none; opacity: .8; stroke-width: 1.5px; }
  /* Handoff phase changes lane/style, never its payload-type color. */
  .link.return { stroke-dasharray: 7 6; opacity: .8; }
  .link.exception { stroke: #f85149 !important; stroke-dasharray: 1 5; stroke-linecap: round; opacity: .95; }
  .link.highlighted { opacity: 1; stroke-width: 2px; }
  .link.dimmed { opacity: .12; }
  .node.tag-hidden, .link.tag-hidden, .edge-label.tag-hidden, .trace-start.tag-hidden { display: none; }
  .trace-start { pointer-events: none; }
  .trace-start path { fill: none; stroke: var(--accent); stroke-width: 1px; stroke-dasharray: 3 3; opacity: .8; }
  .trace-start.fastapi path, .trace-start.fastapi text { stroke: var(--type-tuple); fill: var(--type-tuple); }
  .trace-start text { fill: var(--accent); font: 700 9px var(--mono); letter-spacing: .12em; }
  /* A firing handoff keeps its inferred stroke and fades a type-matched glow. */
  .link.firing {
    filter: drop-shadow(0 0 6px color-mix(in srgb, var(--edge-glow) var(--edge-glow-alpha), transparent));
  }
  .node.dimmed { opacity: .15; }
  .node.pulsing { --node-active: var(--st-busy); }
  .node.pulsing.async { --node-active: var(--st-wait); }
  .node.pulsing rect.body { animation: node-breathe 2.1s ease-in-out infinite; }
  @keyframes node-breathe {
    0%, 100% { stroke: var(--node-active); stroke-width: 1px; filter: drop-shadow(0 0 1px var(--node-active)); }
    50% { stroke: var(--node-active); stroke-width: 1.4px; filter: drop-shadow(0 0 4px var(--node-active)); }
  }
  .edge-label { font-size: 9px; fill: var(--muted); pointer-events: none; text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; }
</style>
</head>
<body>
<div id="header">
  <h1>pylier</h1>
  <span class="slash">/</span>
  <span class="crumb"><b id="h-name">{{NAME}}</b></span>
  <span class="stamp" id="h-stamp">live</span>
  <span class="spacer"></span>
  <span class="dur" id="h-dur"></span>
  <button class="theme-btn" id="b-theme">☀ light</button>
</div>
<div id="main">
  <aside id="traces" aria-label="Recorded traces and filters">
    <div class="pane-head"><h2>1. Traces</h2><button class="pane-toggle" id="b-left" title="Collapse left pane">‹</button><button class="pane-toggle" id="b-traces" title="Collapse traces">⌃</button></div>
    <div id="trace-list"></div>
    <section id="filters" aria-label="Filters">
    <div class="pane-head"><h2>2. Filters</h2><button class="pane-toggle" id="b-filters" title="Collapse filters">⌃</button></div>
    <div class="pane-content">
      <section id="tag-filter">
        <h2>Tags</h2>
        <div id="tag-options" class="tag-options"></div>
        <div id="tag-empty" class="filter-empty">No node tags in this run.</div>
        <div class="filter-mode">
          <label><input type="radio" name="tag-mode" value="any" checked /> Any</label>
          <label><input type="radio" name="tag-mode" value="all" /> All</label>
        </div>
      </section>
      <section class="controls">
        <h2>View</h2>
        <div class="edge-mode" role="group" aria-label="Graph perspective">
          <span>Perspective</span>
          <label><input type="radio" name="perspective" value="application" checked /> Application Flow</label>
          <label><input type="radio" name="perspective" value="data" /> Data Flow</label>
        </div>
        <div class="edge-mode" role="group" aria-label="Edge routing">
          <span>Edges</span>
          <label><input type="radio" name="edge-mode" value="rectilinear" checked /> Rectilinear</label>
          <label><input type="radio" name="edge-mode" value="direct" /> Direct</label>
        </div>
        <label><input type="checkbox" id="c-labels" checked /> Show edge labels</label>
        <label><input type="checkbox" id="c-anim" checked /> Animate execution</label>
        <div class="btns">
          <button id="b-fit">Fit view</button>
          <button id="b-reset">Reset</button>
        </div>
      </section>
    </div>
    </section>
  </aside>
  <div id="graph-wrap">
    <div id="endpoint-bar" aria-label="Endpoints"></div>
    <svg id="graph"></svg>
    <footer id="footer" aria-label="Payload type legend and SSE event console">
      <div class="footer-bar">
        <div class="footer-legend" aria-label="Payload type legend">
          <span class="type-key"><i class="bool"></i>bool</span><span class="type-key"><i class="int"></i>int</span>
          <span class="type-key"><i class="float"></i>float</span><span class="type-key"><i class="str"></i>str</span>
          <span class="type-key"><i class="list"></i>list</span><span class="type-key"><i class="dict"></i>dict</span>
          <span class="type-key"><i class="tuple"></i>set / tuple</span><span class="type-key"><i class="binary"></i>binary</span>
          <span class="type-key"><i class="other"></i>other</span>
        </div>
        <button class="console-toggle" id="b-console" type="button" aria-controls="event-console" aria-expanded="false">SSE console ▲</button>
      </div>
      <section id="event-console" aria-label="Incoming SSE events" hidden>
        <div class="console-head"><span>Incoming SSE events</span><button class="console-clear" id="b-console-clear" type="button">Clear</button></div>
        <div id="event-log" role="log" aria-live="polite"></div>
      </section>
    </footer>
  </div>
  <aside id="sidebar" aria-label="Run and details">
    <div class="resize-handle" id="sidebar-resize"></div>
    <div class="pane-head"><h2>Run + details</h2><button class="pane-toggle" id="b-sidebar" title="Collapse details">›</button></div>
    <div class="pane-content">
      <section class="summary" id="summary">
        <h2>Run summary</h2>
        <div class="row"><span>nodes</span><b id="s-nodes">0</b></div>
        <div class="row"><span id="s-handoffs-label">handoffs</span><b id="s-handoffs">0</b></div>
        <div class="row"><span>duration</span><b id="s-dur">—</b></div>
        <div class="row"><span>trace</span><b id="s-trace">—</b></div>
      </section>
      <section id="details">
        <h2>Details</h2>
        <div class="empty">Click a node or edge to inspect.</div>
      </section>
    </div>
  </aside>
</div>

<script id="embedded-data" type="application/json">__PYLIER_GRAPH_JSON__</script>
<script>
const RAW = __PYLIER_GRAPH__;

// Edge color expresses inferred payload type. Tuple member types are included
// only for 2–3-type heterogeneous tuples, enabling a readable native SVG gradient.
const TYPE_COLOR = {
  bool: "var(--type-bool)", int: "var(--type-int)", float: "var(--type-float)",
  str: "var(--type-str)", list: "var(--type-list)", dict: "var(--type-dict)",
  tuple: "var(--type-tuple)", binary: "var(--type-binary)", other: "var(--type-other)",
};
const TYPE_FILL = {
  dark: { bool: "#a371f7", int: "#2f81f7", float: "#39c5cf", str: "#f778ba", list: "#3fb950", dict: "#d29922", tuple: "#db61a2", binary: "#7d8590", other: "#7d8590" },
  light: { bool: "#8250df", int: "#0969da", float: "#0a7c86", str: "#bf3989", list: "#1a7f37", dict: "#9a6700", tuple: "#bf3989", binary: "#656d76", other: "#656d76" },
};
function payloadCategory(payload) {
  const type = String(payload || "unknown").toLowerCase();
  if (type === "bool") return "bool";
  if (type === "int") return "int";
  if (type === "float") return "float";
  if (type === "str") return "str";
  if (type === "list") return "list";
  if (type === "dict") return "dict";
  if (type === "set" || type === "tuple" || type === "frozenset") return "tuple";
  if (["bytes", "bytearray", "memoryview", "binary"].includes(type)) return "binary";
  return "other";
}
function typeColorOf(d) { return TYPE_COLOR[payloadCategory(d.payload)]; }
function typeFillOf(category) {
  const theme = document.documentElement.getAttribute("data-theme") || "dark";
  return (TYPE_FILL[theme] || TYPE_FILL.dark)[category] || TYPE_FILL.dark.other;
}
function endpointId(endpoint) { return endpoint && endpoint.id ? endpoint.id : endpoint; }
function edgeKey(d) { return `${endpointId(d.source)}|${endpointId(d.target)}`; }
function edgeHash(d) {
  let hash = 0;
  for (const char of edgeKey(d)) hash = (hash * 31 + char.charCodeAt(0)) >>> 0;
  return hash.toString(16);
}
function gradientId(d) { return `edge-gradient-${edgeHash(d)}`; }
function tupleGradientCategories(d) {
  if (String(d.payload || "").toLowerCase() !== "tuple") return [];
  const categories = [...new Set((d.payload_types || []).map(payloadCategory))];
  return categories.length >= 2 && categories.length <= 3 ? categories : [];
}
function edgeStroke(d) {
  return tupleGradientCategories(d).length ? `url(#${gradientId(d)})` : typeColorOf(d);
}
function edgeLabel(d) {
  const members = d.payload_types || [];
  return members.length ? `tuple<${members.join(", ")}>` : (d.payload || "unknown");
}

// node card geometry: width grows with the longer of name/module (+ room for
// the right-aligned latency). Hoisted so collide force + edge router share it.
const NH = 66;
function nodeW(d) {
  const longest = Math.max((d.name || "").length, (d.category || "").length);
  return Math.max(176, longest * 7.2 + 56);
}
function fmtMs(v) {
  if (v == null) return null;
  return v < 1 ? v.toFixed(2) : v < 100 ? Math.round(v) + "" : Math.round(v) + "";
}

let selectedTraceId = null;
function loadView() {
  const source = liveData || RAW;

  if (source && source.nodes) return { traces: [source] };

}
function loadData() {
  const traces = loadView().traces;
  if (!traces.length) return { nodes: [], links: [], categories: [], dataTypes: [], events: [] };
  const selected = traces.find(trace => trace.id === selectedTraceId) || traces[0];

}
function renderTraceTabs(data) {

  traceList.replaceChildren(...traces.map(trace => {

    tab.append(meta);

    return tab;
  }));
  const endpointBar = document.getElementById("endpoint-bar");

  const endpoints = data.nodes.filter(node => node.kind === "endpoint");
  const endpointNodes = endpoints.length ? endpoints : [{ id: data.id, name: data.endpoint?.name || data.name || "trace" }];
  endpointNodes.forEach((endpoint, index) => {

// Live mode: SSE push (graph on topology change, exec batches in real time).
// Static files fall back to the embedded data + a one-shot timeline replay.
const LIVE = location.protocol.startsWith("http") && !location.href.startsWith("file:");
const SSE_LOG_LIMIT = 100;
const sseLog = [];
const pendingSseLog = [];
let sseLogFlushScheduled = false;

function formatSseTime(date) {
  return date.toLocaleTimeString([], { hour12: false }) + `.${String(date.getMilliseconds()).padStart(3, "0")}`;
}

function summarizeSseEvent(kind, payload) {
  if (kind === "graph") {
    const traces = Array.isArray(payload.traces) ? payload.traces : [payload];
    const nodes = traces.reduce((total, trace) => total + (trace.nodes?.length || 0), 0);
    const handoffs = traces.reduce((total, trace) => total + (trace.links?.length || 0), 0);
    const prefix = Array.isArray(payload.traces) ? `${traces.length} trace${traces.length === 1 ? "" : "s"} · ` : "";
    return `${prefix}${nodes} nodes · ${handoffs} handoffs`;
  }
  const events = Array.isArray(payload) ? payload : [];
  const names = events.slice(0, 3).map(event => `${event.kind}:${String(event.node_id || "unknown").split(".").at(-1)}`).join(", ");
  return `${events.length} execution event${events.length === 1 ? "" : "s"}${names ? ` · ${names}` : ""}`;
}

function consoleLine(entry) {
  const line = document.createElement("div");
  line.className = "console-entry";
  const time = document.createElement("time");
  time.textContent = entry.time;
  const kind = document.createElement("span");
  kind.className = "event-kind";
  kind.textContent = entry.kind;
  const summary = document.createElement("span");
  summary.textContent = entry.summary;
  line.append(time, kind, summary);
  return line;
}

function renderSseLog() {
  const log = document.getElementById("event-log");
  log.replaceChildren();
  if (!sseLog.length) {
    const empty = document.createElement("div");
    empty.className = "console-empty";
    empty.textContent = LIVE ? "Waiting for incoming SSE events…" : "Available in a live HTTP viewer.";
    log.append(empty);
    return;
  }
  log.append(...sseLog.map(consoleLine));
  log.scrollTop = log.scrollHeight;
}

function flushSseLog() {
  sseLogFlushScheduled = false;
  if (!pendingSseLog.length) return;
  const log = document.getElementById("event-log");
  log.querySelector(".console-empty")?.remove();
  const fragment = document.createDocumentFragment();
  for (const entry of pendingSseLog.splice(0)) fragment.append(consoleLine(entry));
  log.append(fragment);
  while (log.children.length > sseLog.length) log.firstElementChild?.remove();
  log.scrollTop = log.scrollHeight;
}

function logSseEvent(kind, payload) {
  const entry = { time: formatSseTime(new Date()), kind, summary: summarizeSseEvent(kind, payload) };
  sseLog.push(entry);
  pendingSseLog.push(entry);
  if (sseLog.length > SSE_LOG_LIMIT) sseLog.shift();
  if (!sseLogFlushScheduled) {
    sseLogFlushScheduled = true;
    requestAnimationFrame(flushSseLog);
  }
}

let liveData = null;
if (LIVE) {
  const es = new EventSource("/events");
  es.addEventListener("graph", (e) => {
    const graph = JSON.parse(e.data);
    logSseEvent("graph", graph);
    liveData = graph;
    update();
  });
  es.addEventListener("exec", (e) => {
    const events = JSON.parse(e.data);
    logSseEvent("exec", events);
    playEvents(events);
  });
  es.onerror = () => { es.close(); };
}

let state = { showLabels: true, animate: true, showFramework: false, edgeMode: "rectilinear", perspective: "application", selected: null, tagFilter: new Set(), tagMode: "any" };
function perspectiveLinks(data) {
  return data.perspectives?.[state.perspective]?.links || data.links || [];
}
// nodes currently executing (enter seen, exit not) — drives the status stripe
const active = new Set();

// ---------------------------------------------------------------------------
// Persistent graph: SVG, zoom, layers and the force simulation are created
// ONCE and kept alive. update() joins new data into the existing simulation
// instead of tearing it down, so live additions don't cold-restart the layout.
// ---------------------------------------------------------------------------
const svg = d3.select("#graph");
let w = svg.node().clientWidth, h = svg.node().clientHeight;
svg.attr("viewBox", `0 0 ${w} ${h}`);
const root = svg.append("g");
const zoom = d3.zoom().scaleExtent([0.2, 4]).on("zoom", (e) => root.attr("transform", e.transform));
svg.call(zoom);

const defs = svg.append("defs");
// Concrete marker fills keep SVG arrowheads consistent across dark/light themes.
// Tuple gradients intentionally keep the tuple-color arrowhead for a crisp terminal cue.
function buildMarkers() {
  defs.selectAll("marker").remove();
  Object.keys(TYPE_COLOR).forEach(category => {
    const marker = defs.append("marker")
      .attr("id", `arrow-${category}`).attr("viewBox", "0 -4 8 8").attr("refX", 7).attr("refY", 0)
      .attr("markerWidth", 6).attr("markerHeight", 6).attr("orient", "auto")
      .attr("markerUnits", "userSpaceOnUse");
    marker.append("path").attr("d", "M0,-4L8,0L0,4Z").attr("fill", typeFillOf(category));
  });
  const exception = defs.append("marker")
    .attr("id", "arrow-exception").attr("viewBox", "0 -4 8 8").attr("refX", 7).attr("refY", 0)
    .attr("markerWidth", 6).attr("markerHeight", 6).attr("orient", "auto")
    .attr("markerUnits", "userSpaceOnUse");
  exception.append("path").attr("d", "M0,-4L8,0L0,4Z").attr("fill", "#f85149");
}

function syncGradients(links) {
  const gradientLinks = links.filter(d => tupleGradientCategories(d).length);
  const gradientJoin = defs.selectAll("linearGradient.edge-gradient").data(gradientLinks, gradientId);
  gradientJoin.exit().remove();
  const gradientSel = gradientJoin.enter().append("linearGradient")
    .attr("class", "edge-gradient").attr("gradientUnits", "objectBoundingBox")
    .merge(gradientJoin).attr("id", gradientId);
  gradientSel.each(function (d) {
    const categories = tupleGradientCategories(d);
    const stopJoin = d3.select(this).selectAll("stop").data(categories);
    stopJoin.exit().remove();
    stopJoin.enter().append("stop").merge(stopJoin)
      .attr("offset", (_category, index) => `${(index / (categories.length - 1)) * 100}%`)
      .attr("stop-color", category => typeFillOf(category));

const startsG = root.append("g").attr("class", "starts");
const linksG = root.append("g").attr("class", "links");
const labelsG = root.append("g").attr("class", "labels");
const nodesG = root.append("g").attr("class", "nodes");

const sim = d3.forceSimulation()
  .force("link", d3.forceLink().id(d => d.id).distance(240).strength(0.38))
  .force("charge", d3.forceManyBody().strength(-900).distanceMax(700))
  .force("center", d3.forceCenter(w / 2, h / 2))
  .force("collide", d3.forceCollide().radius(d => Math.hypot(nodeW(d) / 2, NH / 2) + 28).iterations(2))
  .alphaDecay(0.018)
  .velocityDecay(0.55);

let nodeData = [];
let linkData = [];
let nodeSel = null, linkSel = null, labelSel = null, startSel = null;

function neighbors(id) {
  const set = new Set([id]);
  linkData.forEach(l => {
    const s = l.source.id || l.source, t = l.target.id || l.target;
    if (s === id) set.add(t);
    if (t === id) set.add(s);
  });
  return set;
}

// spawn new nodes near an already-placed neighbor (live) else on a spread grid
function spawnPosition(nodeId, prevById, data, idx, total) {
  for (const l of data.links) {
    const other = l.source === nodeId ? l.target : l.target === nodeId ? l.source : null;
    if (other && prevById.has(other)) {
      const p = prevById.get(other);
      return { x: p.x + (Math.random() - 0.5) * 50, y: p.y + (Math.random() - 0.5) * 50 };
    }
  }
  // initial spread: a loose grid so the first layout isn't a collapsed blob
  const cols = Math.ceil(Math.sqrt(total || 1));
  const c = idx % cols, r = Math.floor(idx / cols);
  return { x: w / 2 + (c - cols / 2) * 220, y: h / 2 + (r - cols / 2) * 140 };
}

function statusColor(d) {
  if (active.has(d.id)) return d.is_async ? "var(--st-wait)" : "var(--st-busy)";
  return "var(--st-idle)";
}

function nodeMatchesTags(node) {
  if (!state.tagFilter.size) return true;
  const tags = new Set(node.tags || []);
  return state.tagMode === "all"
    ? [...state.tagFilter].every(tag => tags.has(tag))
    : [...state.tagFilter].some(tag => tags.has(tag));
}

function applyTagVisibility() {
  if (!nodeSel || !linkSel) return;
  const visible = new Set(nodeData.filter(nodeMatchesTags).map(d => d.id));
  nodeSel.classed("tag-hidden", d => !visible.has(d.id));
  linkSel.classed("tag-hidden", d => !visible.has(endpointId(d.source)) || !visible.has(endpointId(d.target)));
  if (labelSel) labelSel.classed("tag-hidden", d => !visible.has(endpointId(d.source)) || !visible.has(endpointId(d.target)));
  if (startSel) startSel.classed("tag-hidden", d => !visible.has(d.id));
}

function traceStartNode(data, nodes) {
  return nodes.find(node => node.is_root) || nodes.find(node => node.is_start)
    || nodes.find(node => node.id === (data.events || []).find(event => event.kind === "enter")?.node_id)
    || nodes[0] || null;
}

function updateStartMarker(data, nodes) {
  const start = traceStartNode(data, nodes);
  const startJoin = startsG.selectAll("g.trace-start").data(start ? [start] : [], node => node.id);
  startJoin.exit().remove();
  const startEnter = startJoin.enter().append("g").attr("class", "trace-start");
  startEnter.append("path");
  startEnter.append("text").text("START");
  startSel = startJoin.merge(startEnter).attr("class", node => `trace-start${node.kind === "fastapi" ? " fastapi" : ""}`);
  startSel.select("path").attr("d", node => {
    const x = -nodeW(node) / 2;
    const y = -NH / 2;
    return `M${x - 28},${y - 22}L${x - 5},${y - 5}`;
  });
  startSel.select("text")
    .attr("x", node => -nodeW(node) / 2 - 31)
    .attr("y", -NH / 2 - 24)
    .attr("text-anchor", "end");
}

function renderTagFilters(nodes) {
  const tags = [...new Set(nodes.flatMap(node => node.tags || []))].sort();
  state.tagFilter = new Set([...state.tagFilter].filter(tag => tags.includes(tag)));
  d3.select("#tag-empty").style("display", tags.length ? "none" : null);
  const tagJoin = d3.select("#tag-options").selectAll("button.tag-option").data(tags, tag => tag);
  tagJoin.exit().remove();
  tagJoin.enter().append("button").attr("class", "tag-option")
    .merge(tagJoin)
    .text(tag => tag)
    .classed("selected", tag => state.tagFilter.has(tag))
    .on("click", (_event, tag) => {
      if (state.tagFilter.has(tag)) state.tagFilter.delete(tag);
      else state.tagFilter.add(tag);

function update() {
  const data = loadData();
  renderTraceTabs(data);
  // header + summary
  d3.select("#h-name").text(data.name || "trace");
  d3.select("#s-nodes").text(data.nodes.length);
  const dataPerspective = state.perspective === "data";
  d3.select("#s-handoffs-label").text(dataPerspective ? "data transfers" : "handoffs");
  d3.select("#s-handoffs").text(dataPerspective ? (data.data_transfers || 0) : (data.handoffs || 0));
  const totalMs = data.total_ms || 0;
  d3.select("#s-dur").text(totalMs ? `${totalMs.toFixed(1)} ms` : "—");
  d3.select("#h-dur").text(totalMs ? `${(totalMs / 1000).toFixed(2)} s total` : "");
  const stamp = d3.select("#h-stamp");
  stamp.classed("live", !!LIVE).classed("done", !LIVE).text(LIVE ? "live" : "completed");
  const tid = runId(data);
  d3.select("#s-trace").text(tid);

  const prevById = new Map(nodeData.map(n => [n.id, n]));
  const prevNodeIds = new Set(prevById.keys());
  const displayedNodes = state.perspective === "data" ? data.nodes.filter(node => !node.is_root) : data.nodes;
  const fresh = displayedNodes.map((d, i) => {
    const prev = prevById.get(d.id);
    if (prev) return Object.assign(prev, d);
    const sp = spawnPosition(d.id, prevById, { ...data, nodes: displayedNodes }, i, displayedNodes.length);
    return Object.assign({}, d, { x: sp.x, y: sp.y });
  });
  const nodeById = new Map(fresh.map(n => [n.id, n]));

  renderTagFilters(fresh);
  const links = perspectiveLinks(data)
    .map((l, i) => ({ ...l, _idx: i }))
    .filter(l => nodeById.has(l.source) && nodeById.has(l.target));

  const newNodeIds = new Set(fresh.map(n => n.id));
  const addedNodes = [...newNodeIds].filter(id => !prevNodeIds.has(id)).length;
  const removedNodes = [...prevNodeIds].filter(id => !newNodeIds.has(id)).length;
  const prevLinkKeys = new Set(linkData.map(edgeKey));
  const newLinkKeys = new Set(links.map(edgeKey));
  const addedLinks = [...newLinkKeys].filter(k => !prevLinkKeys.has(k)).length;
  const removedLinks = [...prevLinkKeys].filter(k => !newLinkKeys.has(k)).length;
  const topologyChanged = addedNodes || removedNodes || addedLinks || removedLinks;

  nodeData = fresh;
  linkData = links;

  // --- node join ---
  const nodeJoin = nodesG.selectAll("g.node").data(fresh, d => d.id);
  nodeJoin.exit().remove();
  const nodeEnter = nodeJoin.enter().append("g")
    .attr("class", d => `node ${d.kind || "pylier"}${d.is_async ? " async" : ""}`)
    .call(d3.drag()
      .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
  nodeEnter.append("rect").attr("class", "body").attr("rx", 3).attr("ry", 3).attr("height", NH).attr("y", -NH / 2);
  nodeEnter.append("rect").attr("class", "status").attr("x", d => -nodeW(d) / 2).attr("y", -NH / 2).attr("width", 5).attr("height", NH).attr("fill", statusColor);
  nodeEnter.append("text").attr("class", "num").attr("y", -15);
  nodeEnter.append("text").attr("class", "name").attr("y", 3);
  nodeEnter.append("text").attr("class", "module").attr("y", 21);
  nodeEnter.append("text").attr("class", "lat").attr("y", -15);
  nodeEnter.on("click", (e, d) => { state.selected = d.id; highlight(d); renderDetails(d); });

  nodeSel = nodeJoin.merge(nodeEnter);
  nodeSel.attr("class", d => `node ${d.kind || "pylier"}${d.is_async ? " async" : ""}${active.has(d.id) ? " pulsing" : ""}`);
  nodeSel.select("rect.body").attr("width", nodeW).attr("x", d => -nodeW(d) / 2);
  nodeSel.select("rect.status")
    .attr("x", d => -nodeW(d) / 2).attr("height", NH).attr("y", -NH / 2)
    .attr("fill", statusColor);
  nodeSel.select("text.num")
    .text((d, i) => String(i + 1).padStart(2, "0"))
    .attr("x", d => -nodeW(d) / 2 + 13)
    .attr("y", -15);
  nodeSel.select("text.name")
    .text(d => d.name)
    .attr("x", d => -nodeW(d) / 2 + 13)
    .attr("y", 3);
  nodeSel.select("text.module")
    .text(d => d.module || d.category || "")
    .attr("x", d => -nodeW(d) / 2 + 13)
    .attr("y", 21);
  nodeSel.select("text.lat")
    .each(function (d) {
      const sel = d3.select(this);
      const last = fmtMs(d.last_ms);
      const avg = fmtMs(d.avg_ms);
      sel.text("");
      if (last != null) {
        sel.append("tspan").text(`${last} ms`);
        if (avg != null && avg !== last) sel.append("tspan").attr("class", "avg").text(` [${avg}]`);
      }
    })
    .attr("x", d => nodeW(d) / 2 - 10)
    .attr("y", -15);

  updateStartMarker(data, fresh);

  // --- link join (payload-type color and optional tuple gradient) ---
  syncGradients(links);
  const linkJoin = linksG.selectAll("path.link").data(links, edgeKey);
  linkJoin.exit().remove();
  linkSel = linkJoin.enter().append("path")
    .attr("class", "link")
    .merge(linkJoin)
    .attr("class", d => `link ${d.metadata?.phase || "handoff"}`)
    .attr("marker-end", d => `url(#arrow-${d.metadata?.phase === "exception" ? "exception" : payloadCategory(d.payload)})`)
    .style("stroke", edgeStroke)
    .attr("stroke-width", 1.5)
    .style("cursor", "pointer");
  linkSel.on("click", (e, d) => { e.stopPropagation(); renderEdgeDetails(d); });

  const labelJoin = labelsG.selectAll("text.edge-label").data(links, edgeKey);
  labelJoin.exit().remove();
  labelSel = labelJoin.enter().append("text")
    .attr("class", "edge-label")
    .merge(labelJoin)
    .text(edgeLabel)
    .style("display", state.showLabels ? null : "none");

  sim.nodes(fresh);
  sim.force("link").links(links);
  if (topologyChanged) sim.alpha(prevNodeIds.size ? 0.12 : 0.65).restart();

  applyTagVisibility();
  if (state.selected && nodeById.has(state.selected) && nodeMatchesTags(nodeById.get(state.selected))) highlight(nodeById.get(state.selected));
  else { state.selected = null; clearHighlight(); }
}

function edgeRoute(d) {
  return state.edgeMode === "direct" ? directRoute(d) : linkRoute(d);
}

function redrawEdges() {
  if (linkSel) linkSel.attr("d", d => edgeRoute(d).path);
  if (labelSel) labelSel
    .attr("x", d => edgeRoute(d).x)
    .attr("y", d => edgeRoute(d).y - 7);
}

sim.on("tick", () => {
  redrawEdges();
  if (nodeSel) nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
  if (startSel) startSel.attr("transform", d => `translate(${d.x},${d.y})`);
});

// Rectilinear routing with rounded corners and a guaranteed straight terminal
// segment. SVG's orient=auto marker uses that final segment as its tangent, so
// it never has to infer a direction from a tight bend. An edge keeps its initial
// axis through force ticks; if cards get too close, it takes an outer bypass.
const ROUTE = { sourcePad: 2, targetPad: 8, approach: 20, corner: 12, bypass: 44 };

function direction(delta, fallback) {
  return Math.sign(delta) || fallback;
}

function roundedPath(points) {
  let path = `M${points[0].x},${points[0].y}`;
  for (let i = 1; i < points.length - 1; i += 1) {
    const a = points[i - 1], b = points[i], c = points[i + 1];
    const inX = b.x - a.x, inY = b.y - a.y;
    const outX = c.x - b.x, outY = c.y - b.y;
    const inLength = Math.hypot(inX, inY), outLength = Math.hypot(outX, outY);
    const cross = inX * outY - inY * outX;
    if (!inLength || !outLength || Math.abs(cross) < 0.01) {
      path += `L${b.x},${b.y}`;
      continue;
    }
    const radius = Math.min(ROUTE.corner, inLength / 2, outLength / 2);
    const before = { x: b.x - (inX / inLength) * radius, y: b.y - (inY / inLength) * radius };
    const after = { x: b.x + (outX / outLength) * radius, y: b.y + (outY / outLength) * radius };
    path += `L${before.x},${before.y}Q${b.x},${b.y} ${after.x},${after.y}`;
  }
  const last = points.at(-1);
  return `${path}L${last.x},${last.y}`;
}

function directCardPoint(node, dx, dy, pad) {
  const extent = Math.max(Math.abs(dx) / (nodeW(node) / 2 + pad), Math.abs(dy) / (NH / 2 + pad));
  return { x: node.x + dx / extent, y: node.y + dy / extent };
}

function directRoute(d) {
  const s = d.source, t = d.target;
  const dx = t.x - s.x, dy = t.y - s.y, length = Math.hypot(dx, dy);
  if (length < 0.001) return { path: `M${s.x},${s.y}L${t.x},${t.y}`, x: s.x, y: s.y };
  // Parallel straight rails: reverse travel reverses the normal, putting a
  // return on the opposite side without curves or simulation-dependent force.
  const lane = 8;
  const nx = (-dy / length) * lane, ny = (dx / length) * lane;
  const rawStart = directCardPoint(s, dx, dy, ROUTE.sourcePad);
  const rawEnd = directCardPoint(t, -dx, -dy, ROUTE.targetPad);
  const start = { x: rawStart.x + nx, y: rawStart.y + ny };
  const end = { x: rawEnd.x + nx, y: rawEnd.y + ny };
  return { path: `M${start.x},${start.y}L${end.x},${end.y}`, x: (start.x + end.x) / 2, y: (start.y + end.y) / 2 };
}

function linkRoute(d) {
  const s = d.source, t = d.target;
  const sw = nodeW(s) / 2, tw = nodeW(t) / 2, hh = NH / 2;
  const dx = t.x - s.x, dy = t.y - s.y;
  const sx = direction(dx, d._idx % 2 ? -1 : 1);
  const sy = direction(dy, d._idx % 2 ? -1 : 1);
  // A direction-relative rail makes reciprocal entry/return handoffs run on
  // opposite physical sides while preserving the selected orthogonal mode.
  const lane = 12;
  const hLane = sx * lane;
  const vLane = -sy * lane;
  const hStart = { x: s.x + sx * (sw + ROUTE.sourcePad), y: s.y + hLane };
  const hEnd = { x: t.x - sx * (tw + ROUTE.targetPad), y: t.y + hLane };
  const vStart = { x: s.x + vLane, y: s.y + sy * (hh + ROUTE.sourcePad) };
  const vEnd = { x: t.x + vLane, y: t.y - sy * (hh + ROUTE.targetPad) };
  const hClearance = (hEnd.x - hStart.x) * sx;
  const vClearance = (vEnd.y - vStart.y) * sy;
  const turnClearance = ROUTE.approach + ROUTE.corner;
  const minClearance = turnClearance * 2 + 4;
  const horizontalOpen = hClearance >= minClearance;
  const verticalOpen = vClearance >= minClearance;

  // Lock the preferred axis once per simulation link. It may use the other
  // open corridor as a safe fallback, but it does not thrash every force tick.
  d._axis ??= Math.abs(dx) >= Math.abs(dy) ? "horizontal" : "vertical";
  let axis = d._axis;
  if (axis === "horizontal" && !horizontalOpen) axis = verticalOpen ? "vertical" : "bypass";
  if (axis === "vertical" && !verticalOpen) axis = horizontalOpen ? "horizontal" : "bypass";

  const offset = ((d._idx % 3) - 1) * 12;
  if (axis === "horizontal") {
    if (Math.abs(dy) < 4) {
      return { path: roundedPath([hStart, hEnd]), x: (hStart.x + hEnd.x) / 2, y: hStart.y };
    }
    const lo = Math.min(hStart.x, hEnd.x) + turnClearance;
    const hi = Math.max(hStart.x, hEnd.x) - turnClearance;
    const midX = Math.max(lo, Math.min(hi, (hStart.x + hEnd.x) / 2 + offset));
    const points = [hStart, { x: midX, y: hStart.y }, { x: midX, y: hEnd.y }, hEnd];
    return { path: roundedPath(points), x: midX, y: (hStart.y + hEnd.y) / 2 };
  }
  if (axis === "vertical") {
    if (Math.abs(dx) < 4) {
      return { path: roundedPath([vStart, vEnd]), x: vStart.x, y: (vStart.y + vEnd.y) / 2 };
    }
    const lo = Math.min(vStart.y, vEnd.y) + turnClearance;
    const hi = Math.max(vStart.y, vEnd.y) - turnClearance;
    const midY = Math.max(lo, Math.min(hi, (vStart.y + vEnd.y) / 2 + offset));
    const points = [vStart, { x: vStart.x, y: midY }, { x: vEnd.x, y: midY }, vEnd];
    return { path: roundedPath(points), x: (vStart.x + vEnd.x) / 2, y: midY };
  }

  // Neither direct corridor has clearance. Leave both cards on the same outer
  // side, route around their expanded bounds, then approach the target straight.
  const side = d._idx % 2 ? -1 : 1;
  const laneY = side > 0
    ? Math.max(s.y + hh, t.y + hh) + ROUTE.bypass
    : Math.min(s.y - hh, t.y - hh) - ROUTE.bypass;
  const start = { x: s.x, y: s.y + side * (hh + ROUTE.sourcePad) };
  const end = { x: t.x, y: t.y + side * (hh + ROUTE.targetPad) };
  const points = [start, { x: start.x, y: laneY }, { x: end.x, y: laneY }, end];
  return { path: roundedPath(points), x: (start.x + end.x) / 2, y: laneY };
}

// --- execution state: status stripe (enter->exit) + a restrained edge handoff ---
function nodeByIdNow(id) { return nodeData.find(n => n.id === id) || null; }

function bumpCalls(id) {
  const n = nodeByIdNow(id);
  if (n) n.calls = (n.calls || 0) + 1;
}

function fireEdge(source, target) {
  if (!linkSel) return;
  const s = linkSel.filter(l => (l.source.id || l.source) === source && (l.target.id || l.target) === target);
  s.interrupt("fire")
    .classed("firing", true)
    .style("--edge-glow", d => typeColorOf(d))
    .style("--edge-glow-alpha", "85%")
    .attr("stroke-width", 3)
    .style("opacity", 1)
    .transition("fire").duration(1000).ease(d3.easeCubicOut)
    .style("--edge-glow-alpha", "0%")
    .attr("stroke-width", 1.5)
    .style("opacity", 0.8)
    .on("end", function () {
      d3.select(this)
        .classed("firing", false)
        .style("--edge-glow", null)
        .style("--edge-glow-alpha", null)
        .style("opacity", null);
    });
}

function pulseStart(id) {
  active.add(id);
  if (nodeSel) nodeSel.filter(d => d.id === id)
    .classed("pulsing", true)
    .select("rect.status").attr("fill", d => statusColor(d));
}
function pulseStop(id) {
  active.delete(id);
  if (nodeSel) nodeSel.filter(d => d.id === id)
    .classed("pulsing", false)
    .select("rect.status").attr("fill", d => statusColor(d));
}

function playEvents(events) {
  if (!state.animate) return;
  for (const ev of events) applyEvent(ev);
}
function applyEvent(ev) {
  if (ev.kind === "enter") {
    pulseStart(ev.node_id);
    bumpCalls(ev.node_id);
    for (const e of ev.edges || []) fireEdge(e.source, e.target);
  } else if (ev.kind === "exit") {
    pulseStop(ev.node_id);
  }
}

function replayTimeline(events) {
  if (!state.animate || !events || !events.length) return;
  let t = 200, prev = events[0].ts;
  for (const ev of events) {
    const gap = Math.min(Math.max((ev.ts - prev) * 1000, 80), 900);
    prev = ev.ts;
    const at = t;
    setTimeout(() => applyEvent(ev), at);
    t += gap;
  }
}

function highlight(d) {
  if (!nodeSel || !linkSel) return;
  const nb = neighbors(d.id);
  nodeSel.classed("dimmed", n => !nb.has(n.id));
  linkSel.classed("highlighted", l => (l.source.id || l.source) === d.id || (l.target.id || l.target) === d.id)
         .classed("dimmed", l => (l.source.id || l.source) !== d.id && (l.target.id || l.target) !== d.id);
}
function clearHighlight() {
  if (nodeSel) nodeSel.classed("dimmed", false);
  if (linkSel) linkSel.classed("highlighted", false).classed("dimmed", false);
}

function renderDetails(d) {
  const det = d3.select("#details");
  det.html("");
  det.append("h2").text("Node");
  det.append("div").attr("class", "drow").html(`<span class="k">name</span><span class="v">${d.name}</span>`);

  det.append("div").attr("class", "drow").html(`<span class="k">calls</span><span class="v">${d.calls || 0}×</span>`);
  if (d.last_ms != null) {

    det.append("div").attr("class", "drow").html(`<span class="k">latency</span><span class="v">${fmtMs(d.last_ms)} ms${avg}</span>`);
  }

  if (!invocations.length) {
    box.append("p").attr("class", "invocation-hint").text("No invocation details were recorded for this node.");
    return;
  }
  box.append("p").attr("class", "invocation-hint").text("Expand a call, then expand its inputs or output.");
  const calls = box.append("div").attr("class", "invocation-list");
  invocations.forEach((invocation, index) => {
    const card = calls.append("section").attr("class", "invocation-card");

    toggle.append("span").attr("class", "chevron").text("▶");

    const callState = invocation.exception ? "failed" : invocation.duration_ms == null ? "running" : `${fmtMs(invocation.duration_ms)} ms`;
    toggle.append("span").attr("class", "call-meta").text(callState);
    toggle.on("click", function () {
      const button = d3.select(this);
      const existing = card.select("div.invocation-body");

        existing.remove();
        button.select(".chevron").text("▶");
        return;
      }
      button.select(".chevron").text("▼");
      const body = card.append("div").attr("class", "invocation-body invocation-io");
      appendInvocationPayloadToggle(body, invocation, "Inputs", "arguments");
      appendInvocationPayloadToggle(body, invocation, invocation.exception ? "Exception" : "Output", invocation.exception ? "exception" : "result");
    });
  });
}

const invocationPayloadCache = new Map();
function renderPayload(pre, payloadText) {
  const text = String(payloadText || "null");
  const token = /"(?:\\.|[^"\\])*"|\btrue\b|\bfalse\b|\bnull\b|-?\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b/g;
  let cursor = 0;
  for (const match of text.matchAll(token)) {
    pre.append(document.createTextNode(text.slice(cursor, match.index)));
    const value = match[0];
    const following = text.slice(match.index + value.length);
    const kind = value.startsWith('"')
      ? (/^\s*:/.test(following) ? "json-key" : "json-string")
      : value === "true" || value === "false" ? "json-boolean"
      : value === "null" ? "json-null" : "json-number";
    const span = document.createElement("span");
    span.className = kind;
    span.textContent = value;
    pre.append(span);
    cursor = match.index + value.length;
  }
  pre.append(document.createTextNode(text.slice(cursor)));
}
async function expandInvocation(body, invocationId, payloadField) {
  const detail = body.append("pre").attr("class", "value").text("Loading captured payload…");
  if (!LIVE) {
    detail.text("Full payload is available only in the live viewer.");
    return;
  }
  try {
    let payload = invocationPayloadCache.get(invocationId);
    if (!payload) {
      const response = await fetch(`/invocations/${encodeURIComponent(selectedTraceId)}/${encodeURIComponent(invocationId)}/payload`);
      if (!response.ok) {
        detail.text(await response.text());
        return;
      }
      payload = await response.json();
      invocationPayloadCache.set(invocationId, payload);
    }
    detail.text("");
    renderPayload(detail.node(), payload[payloadField] || "null");
  } catch {
    detail.text("Could not load the retained payload.");
  }
}

function appendInvocationPayloadToggle(container, invocation, label, payloadField) {
  const toggle = container.append("button").attr("type", "button").attr("class", "io-toggle");
  toggle.append("span").attr("class", "chevron").text("▶");
  toggle.append("span").text(label);
  toggle.append("span").attr("class", "io-meta").text(
    payloadField === "result" ? (invocation.result_type || "empty") :
    payloadField === "exception" ? "error" :
    `${invocation.arguments.length} parameter${invocation.arguments.length === 1 ? "" : "s"}`
  );
  toggle.on("click", function () {
    const button = d3.select(this);
    const existing = container.select(`div.io-payload[data-field="${payloadField}"]`);
    if (!existing.empty()) {
      existing.remove();
      button.select(".chevron").text("▶");
      return;
    }
    button.select(".chevron").text("▼");
    const payload = container.append("div").attr("class", "io-payload").attr("data-field", payloadField);
    if (payloadField === "exception") {
      payload.append("pre").attr("class", "value").text(invocation.exception || "Unknown error");
    } else if (invocation.payload_state === "disabled") {
      payload.append("div").attr("class", "invocation-hint").text("Full values were not captured. Set PYLIER_CAPTURE_VALUES=1 for a future run.");
    } else if (invocation.payload_state === "evicted") {
      payload.append("div").attr("class", "invocation-hint").text("Full payload was evicted by the configured retention limit.");
    } else {
      expandInvocation(payload, invocation.id, payloadField);
    }
  });
}

function renderEdgeDetails(l) {
  const src = l.source.id || l.source, tgt = l.target.id || l.target;
  const srcName = nodeByIdNow(src)?.name || src, tgtName = nodeByIdNow(tgt)?.name || tgt;
  const det = d3.select("#details");
  det.html("");
  det.append("h2").text("Edge");
  det.append("div").attr("class", "drow").html(`<span class="k">flow</span><span class="v">${srcName} → ${tgtName}</span>`);
  det.append("div").attr("class", "drow").html(`<span class="k">payload</span><span class="v">${edgeLabel(l)}</span>`);
  det.append("div").attr("class", "drow").html(`<span class="k">color</span><span class="v">${payloadCategory(l.payload)}</span>`);
  if (l.size != null) det.append("div").attr("class", "drow").html(`<span class="k">size</span><span class="v">${l.size}</span>`);
  det.append("div").attr("class", "drow").html(`<span class="k">count</span><span class="v">${l.count || 1}×</span>`);
  if (l.handoffs?.length) {
    det.append("div").attr("class", "drow").html(`<span class="k">calls</span><span class="v">${l.handoffs.length} observed</span>`);
    det.append("p").attr("class", "invocation-hint").text("Expand a call to load the payload represented by this edge.");
    const invocationById = new Map((loadData().invocations || []).map(invocation => [invocation.id, invocation]));
    const calls = det.append("div").attr("class", "invocation-list");
    l.handoffs.forEach((handoff, index) => {
      const isReturn = l.metadata?.phase === "return" || handoff.provenance === "return";
      const payloadField = isReturn ? "result" : "arguments";
      const invocationId = isReturn
        ? (handoff.invocation_id || handoff.producer_invocation_id)
        : (handoff.consumer_invocation_id || handoff.invocation_id);
      const invocation = invocationById.get(invocationId);
      const label = isReturn ? "Return value" : "Arguments";
      const summary = isReturn ? "" : (handoff.arguments?.join(", ") || handoff.parameter || "arguments");
      const duration = invocation?.duration_ms == null ? "pending" : `${fmtMs(invocation.duration_ms)} ms`;
      const type = isReturn ? (invocation?.result_type || l.payload || "unknown") : (l.payload || "unknown");
      const card = calls.append("section").attr("class", "invocation-card");
      const toggle = card.append("button").attr("type", "button").attr("class", "invocation-toggle");
      toggle.append("span").attr("class", "chevron").text("▶");
      toggle.append("span").attr("class", "call-summary").text(
        summary ? `${label} #${index + 1} · ${summary}` : `${label} #${index + 1}`
      );
      toggle.append("span").attr("class", "call-meta").text(`${type} · ${duration}`);
      if (!invocationId) {
        toggle.attr("disabled", true).attr("title", "No invocation detail is available for this relation.");
        return;
      }
      toggle.on("click", function () {
        const button = d3.select(this);
        const existing = card.select("div.invocation-body");
        if (!existing.empty()) {
          existing.remove();
          button.select(".chevron").text("▶");
          return;
        }
        button.select(".chevron").text("▼");
        const body = card.append("div").attr("class", "invocation-body");
        if (invocation?.payload_state === "disabled") {
          body.append("div").attr("class", "invocation-hint").text("Full values were not captured. Set PYLIER_CAPTURE_VALUES=1 for a future run.");
        } else if (invocation?.payload_state === "evicted") {
          body.append("div").attr("class", "invocation-hint").text("Full payload was evicted by the configured retention limit.");
        } else {
          expandInvocation(body, invocationId, payloadField);
        }
      });
    });
  }
  if (l.value != null && !l.handoffs?.length) {
    det.append("div").attr("class", "drow").html(`<span class="k">value</span><span class="v"></span>`);
    det.append("pre").attr("class", "value").text(l.value);
  } else if (l.preview != null && !l.handoffs?.length) {
    det.append("div").attr("class", "drow").html(`<span class="k">preview</span><span class="v"></span>`);
    det.append("pre").attr("class", "value").text(l.preview);
  } else if (!l.handoffs?.length && l.metadata?.phase === "return" && l.payload && l.payload !== "unknown") {
    det.append("div").attr("class", "drow").html(`<span class="k">return value</span><span class="v"><i>summary captured; set PYLIER_CAPTURE_VALUES=1 for the full value</i></span>`);
  } else if (!l.handoffs?.length && l.payload === "empty") {
    det.append("div").attr("class", "drow").html(`<span class="k">payload</span><span class="v"><i>none — this is an execution relationship, not moved data</i></span>`);
  } else if (!l.handoffs?.length) {
    det.append("div").attr("class", "value").html(`<span class="k">value</span><span class="v"><i>not captured — set PYLIER_CAPTURE_VALUES=1 or run at level "debug" for a preview</i></span>`);
  }
}

function runId(data) {
  const seed = `${data.name || ""}|${(data.nodes || []).length}|${(data.links || []).length}`;
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  return h.toString(16).slice(0, 6);
}

function fit() {
  const bbox = root.node().getBBox();
  if (!isFinite(bbox.width) || !bbox.width) return;
  const scale = Math.min(2, 0.85 / Math.max(bbox.width / w, bbox.height / h));
  const tx = (w - bbox.width * scale) / 2 - bbox.x * scale;
  const ty = (h - bbox.height * scale) / 2 - bbox.y * scale;
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}

function setEdgeMode(mode, persist = true) {
  state.edgeMode = mode === "direct" ? "direct" : "rectilinear";
  d3.selectAll('input[name="edge-mode"]').property("checked", function () { return this.value === state.edgeMode; });
  if (persist) try { localStorage.setItem("pylier-edge-mode", state.edgeMode); } catch { /* private mode */ }
  redrawEdges();
}

d3.select("#b-left").on("click", () => setLeftCollapsed(!main.classList.contains("left-collapsed")));
d3.select("#b-traces").on("click", () => setSectionCollapsed(document.getElementById("traces"), document.getElementById("b-traces"), !document.getElementById("traces").classList.contains("section-collapsed"), "pylier-traces-collapsed"));
d3.select("#b-filters").on("click", () => setSectionCollapsed(filters, document.getElementById("b-filters"), !filters.classList.contains("section-collapsed"), "pylier-filters-collapsed"));
d3.select("#b-sidebar").on("click", () => setSidebarCollapsed(!sidebar.classList.contains("sidebar-collapsed")));
d3.select("#b-console").on("click", () => setConsoleCollapsed(!eventConsole.hidden));
d3.select("#b-console-clear").on("click", () => { sseLog.length = 0; pendingSseLog.length = 0; renderSseLog(); });
const resizeHandle = document.getElementById("sidebar-resize");
resizeHandle.addEventListener("pointerdown", event => {
  event.preventDefault();
  resizeHandle.classList.add("dragging");
  resizeHandle.setPointerCapture(event.pointerId);
  const move = pointerEvent => setSidebarWidth(window.innerWidth - pointerEvent.clientX, false);
  const end = () => {
    resizeHandle.classList.remove("dragging");
    try { localStorage.setItem("pylier-sidebar-width", String(parseInt(getComputedStyle(main).getPropertyValue("--sidebar-w"), 10))); } catch { /* private mode */ }
    resizeHandle.removeEventListener("pointermove", move);
    resizeHandle.removeEventListener("pointerup", end);
  };
  resizeHandle.addEventListener("pointermove", move);
  resizeHandle.addEventListener("pointerup", end);
});

function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  d3.select("#b-theme").text(t === "dark" ? "☀ light" : "☾ dark");
  buildMarkers();
  syncGradients(linkData);
  if (linkSel) linkSel
    .attr("marker-end", d => `url(#arrow-${d.metadata?.phase === "exception" ? "exception" : payloadCategory(d.payload)})`)
    .style("stroke", edgeStroke);
}
const savedTheme = (() => { try { return localStorage.getItem("pylier-theme") || "dark"; } catch { return "dark"; } })();
const savedEdgeMode = (() => { try { return localStorage.getItem("pylier-edge-mode") || "rectilinear"; } catch { return "rectilinear"; } })();
const savedSidebarWidth = (() => {
  try {
    const stored = localStorage.getItem("pylier-sidebar-width");
    return stored === null ? NaN : Number(stored);
  } catch { return NaN; }
})();
const savedLeftCollapsed = (() => { try { return localStorage.getItem("pylier-left-collapsed") === "true"; } catch { return false; } })();
const savedTracesCollapsed = (() => { try { return localStorage.getItem("pylier-traces-collapsed") === "true"; } catch { return false; } })();
const savedFiltersCollapsed = (() => { try { return localStorage.getItem("pylier-filters-collapsed") === "true"; } catch { return false; } })();
const savedSidebarCollapsed = (() => { try { return localStorage.getItem("pylier-sidebar-collapsed") === "true"; } catch { return false; } })();
const savedConsoleCollapsed = (() => { try { return localStorage.getItem("pylier-console-collapsed") !== "false"; } catch { return true; } })();
if (Number.isFinite(savedSidebarWidth)) setSidebarWidth(savedSidebarWidth, false);
setEdgeMode(savedEdgeMode, false);
setLeftCollapsed(savedLeftCollapsed, false);
setSectionCollapsed(document.getElementById("traces"), document.getElementById("b-traces"), savedTracesCollapsed, "pylier-traces-collapsed", false);
setSectionCollapsed(filters, document.getElementById("b-filters"), savedFiltersCollapsed, "pylier-filters-collapsed", false);
setSidebarCollapsed(savedSidebarCollapsed, false);
setConsoleCollapsed(savedConsoleCollapsed, false);
renderSseLog();
applyTheme(savedTheme);
d3.select("#b-theme").on("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") || "dark";
  const nxt = cur === "dark" ? "light" : "dark";
  applyTheme(nxt);
  try { localStorage.setItem("pylier-theme", nxt); } catch { /* private mode */ }
});

window.addEventListener("resize", resizeGraph);

update();
setTimeout(fit, 600);
if (!LIVE) replayTimeline(loadData().events);
</script>
</body>
</html>
