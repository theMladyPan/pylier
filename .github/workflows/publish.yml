name: Publish package to PyPI

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run tests
        run: uv run --locked pytest
      - name: Build distributions
        run: uv build --no-sources
      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl -- python -c "import pylier"
      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz -- python -c "import pylier"
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Fail when version already exists
        run: |
          version="$(uv version --short)"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://pypi.org/pypi/pylier/${version}/json")"
          case "$status" in
            404) ;;
            200)
              echo "pylier ${version} already exists on PyPI. Bump [project].version before publishing."
              exit 1
              ;;
            *)
              echo "Could not check pylier ${version} on PyPI (HTTP ${status})."
              exit 1
              ;;
          esac
      - name: Publish to PyPI
        run: uv publish
