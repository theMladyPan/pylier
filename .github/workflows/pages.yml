name: Publish docs and demos to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group docs --group examples
      - name: Validate project
        run: uv run pytest -q
      - name: Build docs site and demos
        run: |
          # Render static demos into a temp dir first — mkdocs build cleans its
          # site-dir, so demos must be copied in AFTER the docs build.
          mkdir -p _demos_tmp
          uv run python -m examples.ingest html
          mv pylier-ingest.html _demos_tmp/ingest.html
          uv run python -m examples.showcase html --output-dir _demos_tmp
          mv _demos_tmp/pylier-fulfillment-showcase.html _demos_tmp/fulfillment.html
          rm _demos_tmp/pylier-fulfillment-info.html _demos_tmp/pylier-fulfillment.jsonl

          # Build the MkDocs site into _site (overwrites any prior _site).
          uv run mkdocs build --strict --site-dir _site

          # Merge demos under /demos/ — docs link to /demos/ingest.html etc.
          mkdir -p _site/demos
          cp _demos_tmp/*.html _site/demos/
          rm -rf _demos_tmp
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
