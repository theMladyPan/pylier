[project]
name = "pylier"
version = "1.4.0"
description = "Decorator-driven data process & pipeline visualization. Render running code as a force-directed graph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
# `uv add pylier[fastapi]` installs FastAPI/Starlette for the
# `pylier.instrument_fastapi` integration. The integration module itself is
# always present (lazy-imported); this extra only declares its runtime deps.
fastapi = [
    "fastapi>=0.100",
    "starlette>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pylier"]

[tool.hatch.build.targets.wheel.force-include]
"src/pylier/py.typed" = "pylier/py.typed"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "ty>=0.0.69",
    "fastapi>=0.100",
    "httpx>=0.27",
]
examples = [
    "fastapi>=0.100",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty]
# Astral ty (beta) is the type checker. Run: `uv run ty check src`
# Python target is inferred from `requires-python` above (>=3.12). Rule
# severities use ty defaults; tune per-rule under [tool.ty.rules] if a future
# ty release promotes an inherent-`Any` (dynamic JSON shapes) diagnostic to error.
# Pin the dep version in [dependency-groups].dev to control beta churn.
