[project]
name = "pylier"
version = "0.1.0"
description = "Decorator-driven data process & pipeline visualization. Render running code as a force-directed graph."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic-settings>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pylier"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
examples = [
    "fastapi>=0.141.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlite3>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "uvicorn>=0.52.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
